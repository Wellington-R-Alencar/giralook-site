<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo - Giralook</title>
  <meta name="description" content="Catálogo online Giralook - Peças novas e semi-novas selecionadas para crianças de 0 a 16 anos em Cuiabá">
  <meta name="keywords" content="catálogo brechó, roupas infantis Cuiabá, peças semi-novas, moda infantil">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Catálogo - Giralook">
  <meta property="og:description" content="Navegue pelo catálogo online do brechó Giralook em Cuiabá">
  <meta property="og:image" content="assets/img/logo-giralook.png">
  <meta property="og:type" content="website">
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <img src="assets/img/logo-giralook.png" alt="Giralook" class="logo">
      <nav class="menu">
        <a href="index.html">Início</a>
        <a href="catalogo.html" class="ativo">Catálogo</a>
        <a href="desapego.html">Desapego</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
      </nav>
    </div>
  </header>

  <main class="secao">
    <h1>Catálogo Giralook</h1>
    <p class="secao-subtitulo">Peças novas e semi-novas com menor rotatividade, selecionadas para a vitrine digital.</p>

    <!-- Filtros -->
    <div class="row mb-4">
      <div class="col-md-3">
        <label for="filtro-categoria" class="form-label">Categoria</label>
        <select id="filtro-categoria" class="form-select">
          <option value="">Todas</option>
          <!-- Preenchido dinamicamente -->
        </select>
      </div>
      <div class="col-md-3">
        <label for="filtro-faixa" class="form-label">Faixa Etária</label>
        <select id="filtro-faixa" class="form-select">
          <option value="">Todas</option>
          <!-- Preenchido dinamicamente -->
        </select>
      </div>
      <div class="col-md-3">
        <label for="filtro-ordenacao" class="form-label">Ordenar por</label>
        <select id="filtro-ordenacao" class="form-select">
          <option value="data-desc">Mais recentes</option>
          <option value="data-asc">Mais antigos</option>
          <option value="preco-asc">Menor preço</option>
          <option value="preco-desc">Maior preço</option>
        </select>
      </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="text-center my-5" style="display: none;">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Carregando...</span>
      </div>
    </div>

    <!-- Grid de Produtos -->
    <div id="lista-produtos" class="row g-3">
      <!-- Cards gerados via JS -->
    </div>

    <!-- Botão Carregar Mais -->
    <div class="text-center mt-4">
      <button id="btn-carregar-mais" class="btn btn-primary" style="display: none;">
        Carregar mais produtos
      </button>
    </div>
  </main>

  <footer class="rodape">
    <p>Giralook • Moda infantil com carinho • Cuiabá - MT</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/catalogo.js"></script>
</body>
</html>
